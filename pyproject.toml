[project]
name = "baseball-motion-analysis"
version = "0.1.0"
description = "Local-PC baseball motion analysis application for videos and image sequences."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Hyunyong Lee" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.52.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "opencv-python>=4.10.0",
  "numpy>=1.26.0",
  "ipykernel>=7.3.0",
  "matplotlib>=3.11.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.32",
  "mediapipe>=0.10.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "httpx>=0.27.0",
  "types-requests>=2.32.0",
]

[project.optional-dependencies]
pose = [
  "mediapipe>=0.10.0",
]
ml = [
  "scikit-learn>=1.5.0",
  "pandas>=2.2.0",
]

[project.scripts]
bma-api = "baseball_motion_analysis.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
  "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["baseball_motion_analysis"]

[[tool.mypy.overrides]]
module = [
  "cv2.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/baseball_motion_analysis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
