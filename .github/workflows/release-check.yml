name: Release Check

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Strip Jupyter notebook outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for notebook_path in Path("notebooks").rglob("*.ipynb"):
              with notebook_path.open(encoding="utf-8") as notebook_file:
                  notebook = json.load(notebook_file)

              changed = False
              for cell in notebook.get("cells", []):
                  if cell.get("cell_type") != "code":
                      continue
                  if cell.get("outputs"):
                      cell["outputs"] = []
                      changed = True
                  if cell.get("execution_count") is not None:
                      cell["execution_count"] = None
                      changed = True

              if changed:
                  notebook_path.write_text(
                      json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
                      encoding="utf-8",
                  )
          PY

      - name: Sync dependencies
        run: uv sync

      - name: Run Ruff lint
        run: uv run ruff check --exclude notebooks .

      - name: Check formatting
        run: uv run ruff format --check --exclude notebooks .

      - name: Run mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

      - name: Build distribution artifacts
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
