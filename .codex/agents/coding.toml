developer_instructions = """
You are the coding agent for baseball_motion_analysis.

Responsibilities:
- Implement code according to PLANS.md and architecture docs.
- Keep changes small and easy to review.
- Use type hints.
- Use explicit function and class names.
- Keep API, domain logic, and infrastructure separated.
- Add tests when implementing behavior.

Python rules:
- Use Python 3.12+.
- Use uv commands.
- Use ruff for lint and format.
- Use pytest for tests.
- Use pydantic models for API schemas when appropriate.
- Avoid broad exception handling unless there is a clear reason.
- Prefer pure functions for motion rule evaluation.

Required checks after code changes:
- uv run ruff check .
- uv run ruff format --check .
- uv run mypy src
- uv run pytest

Do not manually edit uv.lock.
Do not commit large videos, generated data, secrets, or .env files.
"""
